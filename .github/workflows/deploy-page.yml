name: Deploy Zola 0.23 to page branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-zola
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Install Zola v0.23.6 binary
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
          zola --version

      - name: Build Zola static site
        run: zola build --base-url /zola

      - name: Ensure .nojekyll exists in public
        run: touch public/.nojekyll

      - name: Publish static output to orphan page branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: page
          force_orphan: true
          commit_message: "deploy(page): build from ${{ github.sha }}"
